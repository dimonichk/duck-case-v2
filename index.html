<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duck Case Panel</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
            background: white;
        }
        h1 { margin: 0; font-size: 1.2rem; color: var(--primary); }
        .balance-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #9ca3af;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
        }
        .card h3 { margin-top: 0; color: var(--primary); }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
        }
        .withdraw-form { display: flex; gap: 10px; }
        .withdraw-form input { flex: 1; }
        .footer {
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Duck Case</h1>
            <div class="balance-display" id="balance">0 ₽</div>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('games')">Игры</button>
            <button class="tab-btn" onclick="switchTab('cases')">Кейсы</button>
            <button class="tab-btn" onclick="switchTab('inventory')">Инвентарь</button>
            <button class="tab-btn" onclick="switchTab('withdraw')">Вывод</button>
        </div>

        <div class="content">
            <!-- Вкладка ИГРЫ -->
            <div id="games" class="tab-content">
                <div class="card">
                    <h3>🎮 Рулетка</h3>
                    <p>Ставка от 10₽ до 1000₽</p>
                    <input type="number" id="roulette-bet" placeholder="Сумма ставки" min="10" max="1000">
                    <button onclick="playRoulette()">Крутить</button>
                    <p id="roulette-result"></p>
                </div>
                <div class="card">
                    <h3>🎲 Кости</h3>
                    <p>Угадай число от 1 до 6</p>
                    <input type="number" id="dice-guess" placeholder="Ваше число (1-6)" min="1" max="6">
                    <input type="number" id="dice-bet" placeholder="Ставка" min="10">
                    <button onclick="playDice()">Бросить</button>
                    <p id="dice-result"></p>
                </div>
            </div>

            <!-- Вкладка КЕЙСЫ -->
            <div id="cases" class="tab-content" style="display:none;">
                <div class="card">
                    <h3>📦 Доступные кейсы</h3>
                    <select id="case-select">
                        <option value="100">Обычный кейс (100₽)</option>
                        <option value="500">Редкий кейс (500₽)</option>
                        <option value="1000">Легендарный кейс (1000₽)</option>
                    </select>
                    <button onclick="openCase()">Открыть кейс</button>
                    <p id="case-result"></p>
                </div>
            </div>

            <!-- Вкладка ИНВЕНТАРЬ -->
            <div id="inventory" class="tab-content" style="display:none;">
                <div class="card">
                    <h3>🎒 Ваш инвентарь</h3>
                    <div id="inventory-list">
                        <div class="inventory-item"><span>Нож «Бабочка»</span> <span>500₽</span></div>
                        <div class="inventory-item"><span>Перчатки «Спорт»</span> <span>1200₽</span></div>
                        <div class="inventory-item"><span>Скин «Дракон»</span> <span>300₽</span></div>
                    </div>
                    <hr>
                    <button onclick="sellAll()">Продать всё (50% от цены)</button>
                </div>
            </div>

            <!-- Вкладка ВЫВОД -->
            <div id="withdraw" class="tab-content" style="display:none;">
                <div class="card">
                    <h3>💸 Вывод средств</h3>
                    <p>Минимальная сумма: 100₽</p>
                    <input type="number" id="withdraw-amount" placeholder="Сумма вывода" min="100">
                    <input type="text" id="withdraw-wallet" placeholder="Номер карты / Юмани">
                    <button onclick="requestWithdraw()">Отправить заявку</button>
                    <p id="withdraw-status" style="margin-top:10px; font-size:0.9em;"></p>
                </div>
            </div>
        </div>

        <div class="footer">
            Duck Case Mini App<br>
            Баланс хранится в браузере
        </div>
    </div>

    <script>
        // Инициализация баланса
        let balance = parseFloat(localStorage.getItem('duck_balance')) || 1000;
        document.getElementById('balance').innerText = balance + ' ₽';

        function updateBalance() {
            document.getElementById('balance').innerText = balance + ' ₽';
            localStorage.setItem('duck_balance', balance);
        }

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById(tabName).style.display = 'block';
        }

        // Логика игр
        function playRoulette() {
            const bet = parseInt(document.getElementById('roulette-bet').value);
            const result = document.getElementById('roulette-result');
            
            if (!bet || bet < 10 || bet > 1000) {
                result.innerText = 'Ошибка: ставка от 10 до 1000₽';
                return;
            }
            if (balance < bet) {
                result.innerText = 'Недостаточно средств!';
                return;
            }

            balance -= bet;
            const win = Math.random() > 0.5;
            if (win) {
                const prize = bet * 1.8;
                balance += prize;
                result.innerText = `Победа! Вы выиграли \${prize.toFixed(0)}₽`;
            } else {
                result.innerText = 'Проигрыш... Попробуйте еще раз';
            }
            updateBalance();
        }

        function playDice() {
            const guess = parseInt(document.getElementById('dice-guess').value);
            const bet = parseInt(document.getElementById('dice-bet').value);
            const result = document.getElementById('dice-result');

            if (!guess || guess < 1 || guess > 6 || !bet || bet < 10) {
                result.innerText = 'Ошибка: проверьте ввод';
                return;
            }
            if (balance < bet) {
                result.innerText = 'Недостаточно средств!';
                return;
            }

            balance -= bet;
            const roll = Math.floor(Math.random() * 6) + 1;
            
            if (roll === guess) {
                const prize = bet * 3;
                balance += prize;
                result.innerText = `Вы угадали! Выпало ${roll}. Приз: ${prize}₽`;
            } else {
                result.innerText = `Не повезло. Выпало \${roll}`;
            }
            updateBalance();
        }

        // Логика кейсов
        function openCase() {
            const price = parseInt(document.getElementById('case-select').value);
            const result = document.getElementById('case-result');

            if (balance < price) {
                result.innerText = 'Недостаточно средств для открытия кейса!';
                return;
            }

            balance -= price;
            const random = Math.random();
            let item = '';
            
            if (random < 0.1) item = 'Легендарный нож (5000₽)';
            else if (random < 0.4) item = 'Редкий скин (1500₽)';
            else item = 'Обычный предмет (200₽)';

            result.innerText = `Вы получили: \${item}`;
            updateBalance();
        }

        // Логика вывода
        function requestWithdraw() {
            const amount = parseInt(document.getElementById('withdraw-amount').value);
            const wallet = document.getElementById('withdraw-wallet').value;
            const status = document.getElementById('withdraw-status');

            if (!amount || amount < 100) {
                status.innerText = 'Минимальная сумма 100₽';
                status.style.color = 'red';
                return;
            }
            if (balance < amount) {
                status.innerText = 'Недостаточно средств';
                status.style.color = 'red';
                return;
            }
            if (!wallet) {
                status.innerText = 'Введите реквизиты';
                status.style.color = 'red';
                return;
            }

            balance -= amount;
            updateBalance();
            status.innerText = `Заявка на вывод \${amount}₽ отправлена администратору!`;
            status.style.color = 'green';
            
            // Здесь можно добавить отправку на сервер через fetch
            console.log('Заявка на вывод:', { amount, wallet });
        }

        // Продажа всего инвентаря
        function sellAll() {
            if(confirm('Продать весь инвентарь за 50% от стоимости?')) {
                balance += 1000; // Примерная сумма
                updateBalance();
                alert('Инвентарь продан!');
            }
        }
    </script>
</body>
</html>
